name: Publish packages

on:
  push:
    branches:
      - production
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Configure GitHub Packages registry
        run: |
          echo "@oikos-circular-environment:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump package versions for this publish
        run: |
          for pkg in packages/db packages/api; do
            (cd "$pkg" && npm pkg set version="$(node -pe "require('./package.json').version.split('.').slice(0,2).join('.')" ).${{ github.run_number }}" --no-git-tag-version)
          done
          (cd packages/api && npm pkg set dependencies.@oikos-circular-environment/survey-db="$(node -pe "require('../db/package.json').version")")

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build declaration output
        run: bunx turbo run build --filter=@oikos-circular-environment/survey-db --filter=@oikos-circular-environment/survey-api

      - name: Publish @oikos-circular-environment/survey-db
        working-directory: packages/db
        run: bun publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @oikos-circular-environment/survey-api
        working-directory: packages/api
        run: bun publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
